
    <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cox's Local — Cox's Bazar শহরে দ্রুত বাজার ও নিত্যপ্রয়োজনীয় পণ্য ডেলিভারি।">
<title>Cox's Local — Quick Delivery</title>

<style>
:root{
  --green:#079455;
  --green-dark:#056b3d;
  --light-green:#eaf8f1;
  --orange:#ff7a18;
  --dark:#17221c;
  --gray:#6b756f;
  --bg:#f7faf8;
  --white:#fff;
  --border:#e5ebe7;
  --shadow:0 8px 25px rgba(0,0,0,.07);
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--dark);
  line-height:1.5;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* TOP BAR */
.topbar{
  background:var(--green);
  color:white;
  text-align:center;
  padding:9px 12px;
  font-size:14px;
}

/* HEADER */
header{
  background:white;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
  color:var(--green);
}

.logo span{
  color:var(--orange);
}

.location{
  font-size:12px;
  color:var(--gray);
  white-space:nowrap;
}

.location b{
  display:block;
  color:var(--dark);
  font-size:14px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:13px 16px 13px 44px;
  border:1px solid var(--border);
  background:#f5f8f6;
  border-radius:14px;
  outline:none;
}

.search input:focus{
  border-color:var(--green);
  background:white;
}

.search-icon{
  position:absolute;
  left:15px;
  top:10px;
  font-size:20px;
}

.cart-btn{
  background:var(--dark);
  color:white;
  border-radius:14px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:bold;
}

.cart-count{
  background:var(--orange);
  padding:2px 8px;
  border-radius:20px;
  font-size:13px;
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:auto;
  padding:0 18px;
}

/* HERO */
.hero{
  margin:24px auto;
  background:linear-gradient(120deg,#064d32,#079455);
  border-radius:25px;
  color:white;
  padding:38px;
  min-height:320px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.hero:before{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  border-radius:50%;
  right:-80px;
  top:-120px;
  background:rgba(255,255,255,.08);
}

.hero:after{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  right:100px;
  bottom:-170px;
  background:rgba(255,255,255,.06);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:650px;
}

.pill{
  display:inline-block;
  background:rgba(255,255,255,.15);
  padding:7px 14px;
  border-radius:30px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(32px,5vw,55px);
  line-height:1.08;
  margin-bottom:15px;
}

.hero p{
  color:#e1f5eb;
  font-size:18px;
  margin-bottom:23px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.primary{
  background:white;
  color:var(--green-dark);
  padding:14px 22px;
  border-radius:13px;
  font-weight:800;
}

.secondary{
  background:rgba(255,255,255,.13);
  color:white;
  padding:14px 22px;
  border-radius:13px;
  font-weight:bold;
}

/* SECTION */
.section{
  margin:30px 0;
}

.section-title{
  font-size:27px;
  font-weight:900;
  margin-bottom:5px;
}

.section-subtitle{
  color:var(--gray);
  margin-bottom:18px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding-bottom:8px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  min-width:125px;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px 10px;
  text-align:center;
  transition:.2s;
}

.category:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.category.active{
  background:var(--light-green);
  border-color:#a9ddc4;
}

.category-icon{
  font-size:42px;
  margin-bottom:8px;
}

.category-name{
  font-weight:800;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.product{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
  position:relative;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}

.product-image{
  height:175px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f8f5;
  font-size:78px;
}

.discount{
  position:absolute;
  top:10px;
  left:10px;
  background:var(--orange);
  color:white;
  padding:4px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.product-info{
  padding:14px;
}

.product-name{
  font-size:17px;
  font-weight:800;
  margin-bottom:4px;
}

.product-size{
  font-size:13px;
  color:var(--gray);
  margin-bottom:10px;
}

.price-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.price{
  font-size:19px;
  font-weight:900;
}

.old-price{
  font-size:12px;
  color:#999;
  text-decoration:line-through;
  margin-left:5px;
}

.add-btn{
  background:var(--green);
  color:white;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
}

.add-btn:hover{
  background:var(--green-dark);
}

/* WHY US */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.feature{
  background:white;
  border:1px solid var(--border);
  padding:22px;
  border-radius:18px;
}

.feature-icon{
  font-size:35px;
  margin-bottom:8px;
}

.feature h3{
  margin-bottom:5px;
}

.feature p{
  color:var(--gray);
  font-size:14px;
}

/* FOOTER */
footer{
  background:var(--dark);
  color:white;
  margin-top:45px;
  padding:35px 18px;
}

.footer-inner{
  max-width:1200px;
  margin:auto;
}

.footer-logo{
  font-size:25px;
  font-weight:900;
  color:white;
  margin-bottom:8px;
}

.footer-text{
  color:#b8c3bd;
  max-width:500px;
  margin-bottom:20px;
}

.footer-bottom{
  border-top:1px solid #354039;
  padding-top:18px;
  color:#9ca8a1;
  font-size:13px;
}

/* CART DRAWER */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:200;
  display:none;
}

.overlay.show{
  display:block;
}

.cart-drawer{
  position:fixed;
  right:-420px;
  top:0;
  width:390px;
  max-width:92%;
  height:100%;
  background:white;
  z-index:201;
  transition:.3s;
  padding:20px;
  display:flex;
  flex-direction:column;
}

.cart-drawer.show{
  right:0;
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:15px;
  border-bottom:1px solid var(--border);
}

.close-cart{
  background:#f0f3f1;
  border-radius:50%;
  width:35px;
  height:35px;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:15px 0;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.cart-item-img{
  width:60px;
  height:60px;
  border-radius:12px;
  background:#f3f8f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:bold;
}
